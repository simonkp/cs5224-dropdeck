name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails on high or critical in shipped code)
        run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm web:build
      - name: cdk synth (no AWS credentials needed)
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: ap-southeast-1
        run: npx cdk synth --quiet -c stage=staging

  integration:
    # Real handlers against DynamoDB Local: oversell, shard sweep, idempotency, buyer limit, controller.
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports: ['8000:8000']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dropdeck/integration-tests test
        env:
          DYNAMODB_LOCAL: http://localhost:8000
          REQUIRE_INTEGRATION: '1'

  deploy-staging:
    # Skipped (not failed) until the OIDC stack is deployed and AWS_DEPLOY_ROLE_ARN is set as a repo variable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [check, integration]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write   # GitHub OIDC → AWS, no stored keys
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: cdk deploy
        working-directory: infra
        run: >
          npx cdk deploy DropDeck-staging -c stage=staging
          -c budgetEmail=${{ vars.BUDGET_EMAIL }}
          --require-approval never --outputs-file cdk-outputs.json
      - name: smoke test
        working-directory: infra
        run: |
          SITE=$(node -p "require('./cdk-outputs.json')['DropDeck-staging'].SiteUrl")
          API=$(node -p "require('./cdk-outputs.json')['DropDeck-staging'].ApiUrl")
          curl -fsS "$SITE/" > /dev/null
          curl -fsS "$SITE/config.json"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API/m/drops")
          test "$code" = "401" || (echo "expected 401 from unauthenticated /m/drops, got $code" && exit 1)
