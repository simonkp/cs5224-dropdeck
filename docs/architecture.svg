<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 584' width='760' height='584' role='img' font-family='system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif'><title>DropDeck architecture: the crowd polls the edge; only joins, claims and checkouts reach Lambda</title><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0 0L10 5L0 10z' fill='#a8a59c'/></marker></defs><rect width='760' height='584' fill='#ffffff'/><path d='M162 112V152' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M594 112V152' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M330 112V264' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M424 112V264' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M88 320V392' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M234 320V392' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M380 320V392' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M526 320V392' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M672 352V392' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M88 464V504' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M234 464V504' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M380 464V504' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M526 464V504' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M672 464V504' fill='none' stroke='#a8a59c' stroke-width='1.25' marker-end='url(#arrow)'/><text x='24' y='34' font-size='15' font-weight='600' fill='#1d1c1a' text-anchor='start'>The crowd polls the edge; only joins, claims and checkouts reach Lambda</text><rect x='24' y='56' width='328' height='56' rx='8' fill='none' stroke='#a8a59c' stroke-width='1.25'/><text x='188' y='80' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>Buyer's browser</text><text x='188' y='96' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>Drop page; polls state.json every 2 s</text><rect x='408' y='56' width='328' height='56' rx='8' fill='none' stroke='#a8a59c' stroke-width='1.25'/><text x='572' y='80' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>Merchant's browser</text><text x='572' y='96' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>Console: drops, orders, report</text><text x='170' y='136' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='start'>page, polls</text><text x='602' y='136' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='start'>sign in</text><rect x='24' y='152' width='276' height='72' rx='8' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='2'/><text x='162' y='176' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>CloudFront + S3</text><text x='162' y='192' font-size='11.5' font-weight='400' fill='#1d1c1a' text-anchor='middle'>Console and drop pages</text><text x='162' y='208' font-size='11.5' font-weight='400' fill='#1d1c1a' text-anchor='middle'>drop.json, state.json (1–5 s cache)</text><rect x='452' y='152' width='284' height='56' rx='8' fill='none' stroke='#a8a59c' stroke-width='1.25'/><text x='594' y='176' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>Cognito</text><text x='594' y='192' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>Merchant sign-in, code + PKCE</text><text x='322' y='248' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='end'>ticket, claim, checkout</text><text x='432' y='248' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='start'>/m/* + token</text><rect x='24' y='264' width='566' height='56' rx='8' fill='none' stroke='#a8a59c' stroke-width='1.25'/><text x='307' y='288' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>API Gateway (HTTP API)</text><text x='307' y='304' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>Buyer routes open, /m/* need a token; stage throttle 1,000 rps</text><rect x='606' y='264' width='130' height='88' rx='8' fill='none' stroke='#a8a59c' stroke-width='1.25'/><text x='671' y='288' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>Scheduler</text><text x='671' y='304' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>EventBridge:</text><text x='671' y='320' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>open once, then</text><text x='671' y='336' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>tick each minute</text><rect x='24' y='392' width='128' height='72' rx='8' fill='none' stroke='#a8a59c' stroke-width='1.25'/><text x='88' y='416' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>Ticket</text><text x='88' y='432' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>Draw, then</text><text x='88' y='448' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>block numbers</text><rect x='170' y='392' width='128' height='72' rx='8' fill='none' stroke='#a8a59c' stroke-width='1.25'/><text x='234' y='416' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>Claim</text><text x='234' y='432' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>Conditional</text><text x='234' y='448' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>reserve + hold</text><rect x='316' y='392' width='128' height='72' rx='8' fill='none' stroke='#a8a59c' stroke-width='1.25'/><text x='380' y='416' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>Checkout</text><text x='380' y='432' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>Email code,</text><text x='380' y='448' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>order, PayNow</text><rect x='462' y='392' width='128' height='72' rx='8' fill='none' stroke='#a8a59c' stroke-width='1.25'/><text x='526' y='416' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>Merchant API</text><text x='526' y='432' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>Drops, orders,</text><text x='526' y='448' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>CSV, report</text><rect x='608' y='392' width='128' height='72' rx='8' fill='none' stroke='#a8a59c' stroke-width='1.25'/><text x='672' y='416' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>Controller</text><text x='672' y='432' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>Open, sweep,</text><text x='672' y='448' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>close, publish</text><rect x='24' y='504' width='712' height='56' rx='8' fill='none' stroke='#a8a59c' stroke-width='1.25'/><text x='380' y='528' font-size='13' font-weight='600' fill='#1d1c1a' text-anchor='middle'>DynamoDB, one on-demand table</text><text x='380' y='544' font-size='11.5' font-weight='400' fill='#5f5b53' text-anchor='middle'>Drops, stock shards, holds, orders, buyer limits; every stock change is a conditional write</text></svg>
